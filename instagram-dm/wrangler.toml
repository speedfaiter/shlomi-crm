name = "instagram-dm"
main = "src/index.js"
compatibility_date = "2026-10-01"

# כל 5 דקות: שולח הודעות שחיכו בתור + מחדש את הטוקן כשצריך
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "instagram-dm"
database_id = "4de607f3-ab64-4729-a347-d37cd8c0564a"

[vars]
# גרסת ה-API של מטא. לעדכן לגרסה העדכנית שמופיעה בהגדרות ה-Webhook
GRAPH_VERSION = "v26.0"
# כמה הודעות פרטיות לשלוח לכל היותר בשעה (שמרני, כדי לא להיתקע במגבלות של מטא)
MAX_PER_HOUR = "150"
BRAND_NAME = "שלומי חן מוביל ילדים להצלחה"
CONTACT_EMAIL = "mastermbtm@gmail.com"

# סודות (מוגדרים עם `npx wrangler secret put <NAME>`, לא כאן):
#   IG_APP_ID        - Instagram app ID מהדשבורד של מטא
#   IG_APP_SECRET    - Instagram app secret
#   VERIFY_TOKEN     - מחרוזת אקראית שמדביקים גם בהגדרות ה-Webhook במטא
#   ADMIN_PASSWORD   - הסיסמה לדף הניהול
#   META_APP_SECRET  - (לא חובה) App secret מ-App settings ← Basic, אם מטא חותמת איתו את ה-webhooks
